# .github/workflows/main.yml
# Имя workflow:
name: Main Workflow
# Перечень событий-триггеров, при которых должен запускаться workflow:
on:
  # Событие push возникает,
  # когда изменения исходного кода приходят на сервер GitHub.
  push:
    # Отслеживаем изменения только в ветке main:
    branches:
      - main
  # Хотим запускать pipeline по кнопке "Run workflow"
  workflow_dispatch:

# Перечень задач
jobs:

  # Прогоняем flake8 по коду бэкенда:
  linter:
    name: Lint backend code
    # Разворачиваем окружение:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
    # Копируем код проекта:
    - name: Check out code
      uses: actions/checkout@v3
    # Устанавливаем Python с помощью action:
    - name: Set up Python
      uses: actions/setup-python@v4
    # В action setup-python@v4 передаём параметр — версию Python:
      with:
        python-version:  ${{ matrix.python-version }}
    - name: Display Python version
      run: python -c "import sys; print(sys.version)"
    # Обновляем pip, устанавливаем flake8 и flake8-isort, 
    # устанавливаем зависимости проекта:
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip 
        pip install flake8==6.0.0 flake8-isort==6.0.0
    # Запускаем flake8:
    - name: Test with flake8
      # Вызываем flake8 и указываем ему,
      # что нужно проверить файлы только в папке backend/
      run: python -m flake8 backend/

  # Заливаем образ бэкенда на Docker Hub:
  build_and_push_backend_to_docker_hub:
    name: Push Backend Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: linter
    steps:
      - name: Check out the repo
        # Получение исходного кода из репозитория:
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        # Установка сборщика контейнеров Docker:
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        # Авторизация на Docker Hub:
        uses: docker/login-action@v2
        # При помощи with передаём в action параметры username и password:
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        # Одновременный билд и пуш образа в Docker Hub:
        uses: docker/build-push-action@v4
        with:
          # Параметр context: ./backend/ указывает, что нужный Dockerfile 
          # находится в ./backend/
          context: ./backend/
          # Параметр push: true указывает, что образ нужно не только собрать,
          # но и отправить на Docker Hub:
          push: true
          # В параметре tags задаётся название и тег для образа.
          # Для каждого пересобранного образа 
          # устанавливаем тег latest, чтобы потом
          # на сервере и в docker-compose.yml не указывать версию образа:
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_backend:latest
  
  # Тесты фронтенда
  frontend_tests:
    name: Test frontend
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up nodeJS
      # Это готовый воркфлоу для установки Node.js на раннер
      uses: actions/setup-node@v3
      with:
        # Это параметр воркфлоу, указывающий нужную версию Node.js
        node-version: 18

    - name: Install dependencies
      # Эта команда устанавливает зависимости для фронтенда
      run: |
        cd frontend/
        npm ci

    - name: Test frontend
      # Запускаем тесты
      run: |
        cd frontend/
        npm run test

  # Заливаем образ фронтенда на Docker Hub:
  build_and_push_frontend_to_docker_hub:
    name: Push frontend Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: frontend_tests
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_frontend:latest

  # Заливаем образ гейтвея на Docker Hub:
  build_and_push_gateway_to_docker_hub:
    name: Push gateway Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./nginx/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_gateway:latest 
          
  # Выкладка на сервер
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: 
      # Дождёмся билда всех фронтенда, бэкенда и гейтвея:
      - build_and_push_backend_to_docker_hub
      - build_and_push_frontend_to_docker_hub
      - build_and_push_gateway_to_docker_hub
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
    # Пробуем получить адрес машины, которая могла быть создана через workflow Terraform:
    # Устанавливаем awscli и jq для скачивания и парсинга файла state
    - name: Install tools
      run: |
        sudo apt-get update && sudo apt-get install -y jq
        python -m pip install --upgrade pip
        pip install awscli
    # Читаем bucket и key (файл state) из конфига provider.tf
    - name: Read backend config
      id: backend
      working-directory: ./infra
      run: |
        BUCKET=$(grep 'bucket ' provider.tf | awk -F '"' '{print $2}')
        KEY=$(grep 'key ' provider.tf | awk -F '"' '{print $2}')

        echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
        echo "key=$KEY" >> $GITHUB_OUTPUT
    # Идем в S3-хранилище и в файле state находим ip-адрес (записали его в outputs, см пайплайн Terraform)
    - name: Download state
      id: ip
      run: |
        VM_IP=""

        aws s3 cp \
          s3://${{ steps.backend.outputs.bucket }}/${{ steps.backend.outputs.key }} \
          state.json \
          --endpoint-url https://storage.yandexcloud.net || true

        if [ -f state.json ]; then
          VM_IP=$(jq -r '.outputs.vm_ip.value // empty' state.json)
        fi
        echo "vm_ip=$VM_IP" >> $GITHUB_OUTPUT

        if [ -n "$VM_IP" ]; then
          echo "HOST=$VM_IP" >> $GITHUB_ENV
        else 
          echo "HOST=${{ secrets.HOST }}" >> $GITHUB_ENV
        fi
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
    # Собираем .env с необходимыми переменными (типа ALLOWED_HOSTS)
    - name: Create .env
      shell: bash
      run: |
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
          echo "DEBUG=False" >> .env
          echo "ALLOWED_HOSTS=127.0.0.1,localhost,${{ env.HOST }}" >> .env
          echo "SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" >> .env
    # Копируем .env и docker-compose.production.yml на продакшен-сервер:
    - name: Copy docker-compose.yml via ssh
      uses: appleboy/scp-action@master
      # Передаём параметры для action appleboy/scp-action:
      with:
        host: ${{ env.HOST }}
        username: ${{ secrets.USER }}
        # Если используется не VM, созданная Terrafrom, то нужен другой ключ
        key: ${{ steps.ip.outputs.vm_ip && secrets.TERRAFORM_VM_SSH_KEY || secrets.SSH_KEY }}
        source: "docker-compose.production.yml,.env"
        target: ${{ secrets.TARGET_DIRECTORY }}
    - name: Executing remote ssh commands to deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ env.HOST }}
        username: ${{ secrets.USER }}
        key: ${{ steps.ip.outputs.vm_ip && secrets.TERRAFORM_VM_SSH_KEY || secrets.SSH_KEY }}
        # Параметр script передаёт в action appleboy/ssh-action команды,
        # которые нужно выполнить на сервере, 
        # с которым установлено соединение:
        # Seems like sudo apt-get install docker-compose-plugin on server
        # solved our problem with legacy docker-compose (with hyphen)
        script: |
          cd ${{ secrets.TARGET_DIRECTORY }}
          # Выполняет pull образов с Docker Hub
          sudo docker compose -f docker-compose.production.yml pull
          # Перезапускает все контейнеры в Docker Compose
          sudo docker compose -f docker-compose.production.yml down
          sudo docker compose -f docker-compose.production.yml up -d

  # Тесты c окружением на основе содержимого pytest.yml
  autotests:
    name: Autotests
    # Прогоняем тесты из директории tests в корне проекта
    runs-on: ubuntu-latest
    needs: deploy
    steps:
    # Копируем код проекта:
    - name: Check out code
      uses: actions/checkout@v3
    # Устанавливаем Python с помощью action:
    - name: Set up Python
      uses: actions/setup-python@v4
    # В action setup-python@v4 передаём параметр — версию Python:
      with:
        python-version: 3.9
    # Обновляем pip, устанавливаем pytest и зависимости
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest
    - name: Run tests
      run: |
        pytest -c tests.yml tests

  # Порадовать себя нотификацией в Телеге
  send_notification:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: autotests
    steps:
    - name: Send message
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          Kittygram: workflow run #${{ github.run_number }}
          after commit ${{ github.sha }} by ${{ github.actor }} was successful!
          Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}