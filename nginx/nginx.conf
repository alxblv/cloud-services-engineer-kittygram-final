server {
  listen 80;
  index index.html;

  location /static/ {
    alias /static/;
    # autoindex on; # attempt to fix "directory index of "/static/" is forbidden"
  }

  location / {
    proxy_pass http://backend:8000; # same as service name in docker-compose.yml

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-For-Proto $scheme;
  }
}
