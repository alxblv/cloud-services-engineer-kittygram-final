# copied from taski repository (sprint 15, topic 3, step 3)
[flake8]
# Не проверять код на соответствие стандартам W503 и F811
ignore = 
    W503,
    F811,
    # F401 - as we are not sure whether backend/cats/admin.py will always be empty
    F401 
exclude = 
    tests/,
    */migrations/,
    venv/,
    */venv/,
    .venv/
    env/
    */env/,
# Не проверять указанные файлы на соответствие определённым правилам:
per-file-ignores =
    */settings.py:E501 