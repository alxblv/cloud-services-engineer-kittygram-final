# Файл docker-compose.yml

# Версия docker-compose:
#version: '3' # version is obsolete

# Перечень volume:
volumes:
  pg_data:
  static:
  media:

# Перечень контейнеров:
services:
  # Имя и описание первого контейнера; имя выбирает разработчик. 
  # Это контейнер с базой данных:
  # this name will be used as a value of DB_HOST env variable
  postgres:
    # Из какого образа запустить контейнер:
    image: postgres:13.10
    # Файл (или список файлов) с переменными окружения:
    env_file: .env
    # Какой volume подключить для этого контейнера:
    volumes:
      - pg_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  # Имя и описание контейнера с бэкендом:
  backend:
    # Из какого Dockerfile собирать образ для этого контейнера:
    build: ./backend/
    env_file: .env
    volumes:
      - static:/code/static # WORKDIR from Dockerfile + STATIC_ROOT from settyngs.py
      - media:/code/media
    # Какие контейнеры нужно запустить до старта этого контейнера:
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    restart: on-failure # just to ensure it is indeed started AFTER postgres is ready to listen?

  # Имя третьего контейнера. Это контейнер с фронтендом:
  frontend:
    env_file: .env
    build: ./frontend/
    volumes:
      - static:/app/build/static

  ##
  gateway:
    env_file: .env
    build: ./nginx/
    ports:
      - "80:80"
    volumes:
      - static:/app/static/
      - media:/app/media
    depends_on:
      - backend
      - frontend
    restart: on-failure